name = "claude"
main = "src/worker.mjs"
compatibility_date = "2026-09-23"
pages_build_output_dir = "./dist"

[previews]

[assets]
directory = "./dist"
binding = "STATIC_ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "single-page-application"

[env.preview]
name = "claude-preview"
workers_dev = true
preview_urls = true
